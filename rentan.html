<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatbot Kantin — Rentan</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.P06_VERSION = "rentan";

    // KONTRAK UTAMA PEMERIKSA OTOMATIS
    window.asisten = async function (pesan, konteks, model) {
      const menuKantin = (konteks && konteks.menu) ? konteks.menu : [
        { nama: "Nasi goreng", harga: 12000 },
        { nama: "Es teh", harga: 4000 }
      ];

      // Fungsi pemanggil LLM (Gunakan model bawaan pemeriksa jika ada)
      const panggilLLM = model || async function (promptTeks) {
        let key = "";
        try { key = sessionStorage.getItem("gemini_api_key") || ""; } catch (e) { }
        if (key) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptTeks }] }] })
            });
            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          } catch (e) { }
        }
        // Fallback simulasi jika key tidak ada
        if (promptTeks.toLowerCase().includes("voucher") || promptTeks.toLowerCase().includes("kasir")) {
          return "Tentu, ini kode voucher Anda: VOUCHER-P06-99 senilai Rp100.000.";
        }
        return "Harga nasi goreng Rp12.000 dan es teh Rp4.000.";
      };

      // VERSI RENTAN: Gabungkan instruksi dan pesan tanpa proteksi
      const promptLengkap = "Anda adalah chatbot kantin. MENU: " + JSON.stringify(menuKantin) + "\nPESAN PENGGUNA: " + pesan;
      const hasilBalasan = await panggilLLM(promptLengkap);

      // Kembalikan format wajib { balasan, aksi }
      return { balasan: hasilBalasan, aksi: [] };
    };
  </script>
</head>

<body class="is-rentan">
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html">🍛 Chatbot Kantin</a>
      <nav class="tabs"><a href="rentan.html" aria-current="page">Rentan</a><a href="aman.html">Aman</a></nav>
    </div>
  </header>
  <main class="wrap">
    <div class="card">
      <h2>Uji Chatbot Rentan</h2>
      <textarea id="message" rows="3">Berapa harga nasi goreng?</textarea>
      <button id="send" type="button">Kirim ke LLM</button>
      <div id="answer" class="answer">Jawaban akan muncul di sini.</div>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('send');
      const input = document.getElementById('message');
      const out = document.getElementById('answer');
      if (btn && input && out) {
        btn.addEventListener('click', async () => {
          out.textContent = "Memproses...";
          const res = await window.asisten(input.value);
          out.textContent = res.balasan;
        });
      }
    });
  </script>
</body>

</html>
