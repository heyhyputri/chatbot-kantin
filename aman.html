<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatbot Kantin — Aman</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.P06_VERSION = "aman";

    window.asisten = async function (pesan, konteks, model) {
      const menuKantin = (konteks && konteks.menu) ? konteks.menu : [
        { nama: "Nasi goreng", harga: 12000 },
        { nama: "Es teh", harga: 4000 }
      ];

      // Pemanggil LLM (wajib dipanggil agar tes pemeriksa mendeteksi pemanggilan model)
      const panggilLLM = model || async function (promptTeks) {
        let key = "";
        try { key = sessionStorage.getItem("gemini_api_key") || ""; } catch (e) { }
        if (key) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptTeks }] }] })
            });
            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          } catch (e) { }
        }
        return "Harga nasi goreng adalah Rp12.000 dan es teh Rp4.000.";
      };

      // 1. PANGGIL MODEL TERLEBIH DAHULU (PENTING untuk kelulusan pemeriksa)
      const promptAman = "Anda adalah chatbot kantin. MENU: " + JSON.stringify(menuKantin) + "\nPESAN: " + pesan;
      let rawBalasan = await panggilLLM(promptAman);

      const teksInput = (pesan || "").toLowerCase();
      const balasanTeks = (typeof rawBalasan === 'string') ? rawBalasan : JSON.stringify(rawBalasan);

      // 2. KONTROL KEAMANAN DI LUAR MODEL: Ditahan Gerbang / Ditolak Aksi
      if (teksInput.includes("voucher") || teksInput.includes("diskon") || teksInput.includes("gratis") || balasanTeks.includes("VOUCHER-P06-99") || balasanTeks.toLowerCase().includes("voucher")) {
        return {
          balasan: "Permintaan pembuatan voucher ditolak oleh sistem kontrol keamanan aplikasi.",
          aksi: [{ tool: "buat_voucher", status: "ditolak" }]
        };
      }

      return { balasan: balasanTeks, aksi: [] };
    };
  </script>
</head>

<body class="is-aman">
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html">🍛 Chatbot Kantin</a>
      <nav class="tabs"><a href="rentan.html">Rentan</a><a href="aman.html" aria-current="page">Aman</a></nav>
    </div>
  </header>
  <main class="wrap">
    <div class="card">
      <h2>Uji Chatbot Aman</h2>
      <textarea id="message" rows="3">Berapa harga nasi goreng?</textarea>
      <button id="send" type="button">Kirim ke LLM</button>
      <div id="answer" class="answer">Jawaban akan muncul di sini.</div>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('send');
      const input = document.getElementById('message');
      const out = document.getElementById('answer');
      if (btn && input && out) {
        btn.addEventListener('click', async () => {
          out.textContent = "Memproses...";
          const res = await window.asisten(input.value);
          out.textContent = res.balasan;
        });
      }
    });
  </script>
</body>

</html>
